# ------------------------------------------------------------------
# WHO YOU ARE: the top of the page and the "About" section.
# Text fields accept Markdown: **bold**, *italic*, [links](https://...)
# ------------------------------------------------------------------

name: "Josh Koiro"
role: "Estimator & Digital Handyman"

# Handwritten sign-off shown at the end of the About section. Remove the line to hide it.
signature: "/assets/img/signature.png"

# Desk illustration under the opening statement. It's used as a stencil filled with the
# page's ink colour, so it turns white in dark mode. Remove the line to hide it.
illustration: "/assets/img/desk.webp"
illustration_alt: "Illustration of a bearded developer at a desk with a typewriter, headphones and a monitor"

# The big opening line.
#   - Wrap words in **double asterisks** to make them bold.
#   - Leave a blank line to start a new line with some space above it.
#   - Keep the "|-" after "intro:"; it tells YAML a block of text follows. Without it,
#     a colon in the text (like "them**:") breaks the file.
# ("sixty‑year‑old" uses non-breaking hyphens so it never splits across lines.)
intro: |-
  I'm **curious about almost everything**. I understand things by
  **building them**: software, songs, essays and the occasional sixty‑year‑old typewriter.

  Always with a cup of **coffee** close by...

# The "About" section: one entry per paragraph.
about:
  - >-
    **Hi There!**
  - >-
    I'm Josh, a mechanical designer turned estimator and digital handyman.
  - >-
    By day I work in estimating and sales at **Beta Star Life Science Equipment**. I started
    out in the engineering group as a mechanical designer after studying CAD at Thaddeus
    Stevens College, and learning the product line inside and out led to my favorite kind
    of problem: building the configuration and quoting tools the team now runs on, in
    JavaScript, Excel VBA and SQL Server. My goal with any system is to automate it well
    enough that I can move on to the next interesting thing.
  - >-
    Outside of work I'm a learning addict with too many tabs open. I write in-depth pieces
    where faith, psychology and philosophy meet (an honest search for truth, wherever it
    leads), I make music, and I keep a small home lab running. I also restore
    [vintage typewriters](https://joshkoiro.github.io/typewriters/).
  - >-
    Mostly, though, I'm a husband and a dad, held together by love and a non-negotiable
    amount of coffee.
  - >-
    Thanks for checking out my website. Feel free to reach out if you have any questions or just
    want to nerd out, over a shared interest!
  - >-
    --Josh

