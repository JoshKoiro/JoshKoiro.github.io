name: "Josh Koiro"
role: "Estimator & Digital Handyman"

# Handwritten sign-off shown at the end of the About section. Remove the line to hide it.
signature: "/assets/img/signature.png"

# Desk illustration under the opening statement. It's used as a stencil filled with the
# page's ink colour, so it turns white in dark mode. Remove the line to hide it.
