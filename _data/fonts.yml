# ------------------------------------------------------------------
# FONTS: change the site's typography here, nowhere else.
#
# Each role has three settings:
#   name:     the font's name, spelled exactly as on Google Fonts
#   google:   the part of the Google Fonts URL after "family=". Get it from
#             fonts.google.com > pick a font > "Get font" > "Get embed code",
#             and copy what follows "family=" (up to the next "&").
#             Use "" for a font that's installed on the computer (no download).
#   fallback: fonts to use while loading, or if the font isn't available
#
# Fonts worth trying (name / google):
#   Inter              / Inter:wght@400;500;600;700          (current: clean, neutral)
#   Inter Tight        / Inter+Tight:wght@500;600;700        (current headings: Inter, tighter)
#   Manrope            / Manrope:wght@400;500;600;700        (softer, geometric)
#   DM Sans            / DM+Sans:wght@400;500;600;700
#   Geist              / Geist:wght@400;500;600;700
#   Newsreader         / Newsreader:opsz,wght@6..72,400;6..72,600  (elegant serif for body text)
#   Special Elite      / Special+Elite                       (worn typewriter)
#   Cutive Mono        / Cutive+Mono                         (light typewriter)
#   IBM Plex Mono      / IBM+Plex+Mono:wght@400;700
#   Space Mono         / Space+Mono:wght@400;700
#   Courier Prime      / Courier+Prime:wght@400;700
#   Libre Baskerville  / Libre+Baskerville:wght@400;700      (classic serif)
#   Lora               / Lora:wght@400;600
#   Source Serif 4     / Source+Serif+4:opsz,wght@8..60,400;8..60,600
# Sizes and letter spacing live at the top of assets/css/style.css (--text-*, --tracking-*).
# ------------------------------------------------------------------

heading:   # site title, page titles, card titles, section headings
  name: "Inter Tight"
  google: "Inter+Tight:wght@500;600;700"
  fallback: '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif'

body:      # notes and other longer text
  name: "Inter"
  google: "Inter:wght@400;500;600;700"
  fallback: '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif'

ui:        # labels, filters, badges, details, buttons
  name: "Inter"
  google: "Inter:wght@400;500;600;700"
  fallback: '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif'
